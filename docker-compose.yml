version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: transmap-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - PORT=8000
    restart: unless-stopped
    networks:
      - transmap-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: transmap-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - transmap-network

networks:
  transmap-network:
    driver: bridge
